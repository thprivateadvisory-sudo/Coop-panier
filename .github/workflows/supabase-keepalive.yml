name: Supabase Keep-Alive

# L'offre gratuite de Supabase met le projet en pause après 7 jours sans activité.
# Ce workflow interroge la base tous les 3 jours pour la garder active.

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://gzykmayyxkyamymaknsq.supabase.co
          # Clé publique (déjà embarquée dans mobile/app.json)
          SUPABASE_KEY: sb_publishable_vgc-zYhRHJO6p6Kz8DvwDQ_06rsxr1n
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/impact_stats?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::Supabase a répondu $status (projet en pause ?)"
            exit 1
          fi
